# 公開版（体験）を Fly.io の東京で動かす設定。立て方は README の「公開版を自分で立てる」。
# app の名前は Fly.io 全体で1つなので、ほかの人が立てる時は自分の名前に変える。
app = "boshi-techo-try"
primary_region = "nrt"
# 小さな機械（審査の間は 1GB・ふだんは 512MB）で、写真の加工や組み立ての山で落ちないように（表の見出しより前に置く＝全体の設定）
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  # ログインの戻り先（体験版の住所）
  BETTER_AUTH_URL = "https://boshi-techo-try.fly.dev"
  # 1つの住所から1日に作れる体験の写し（会場や病院の Wi-Fi は、大勢が同じ住所になる）
  BOSHI_TRIALS_PER_IP_DAY = "100"
  # 体験版は Claude を呼ばない（鍵を入れない・lib/claude.ts の歯止め）。Claude の額の上限（BOSHI_DAILY_USD・BOSHI_HOUSEHOLD_DAILY_USD）は置かない

[[mounts]]
  source = "boshi_data"
  destination = "/data"
  # 容量が足りなくなる前に自動で広げる（使った量が 70% を超えたら 1GB ずつ、5GB まで）。
  # 空きが 20% を切ると、アプリは新しい体験の写しを作らず読むだけの見本にする（src/lib/trial.ts）ので、その手前で広げる
  auto_extend_size_threshold = 70
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite を1台で持つので、止めずに1台だけ動かす
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # 見張り（15秒ごと）。道は札を配らず写しも作らない口（src/app/api/health・middleware.ts）。
  # /api/family などを見張ると、札の無い頼みに札を配って15秒ごとに写しが1つ増えるので使わない
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 審査の間（〜11/10）は 1GB。終わったら 512mb に戻す
  memory = "1gb"
