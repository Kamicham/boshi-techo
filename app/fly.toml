# 公開版（体験）を Fly.io の東京で動かす設定。立て方は README の「公開版を自分で立てる」。
# app の名前は Fly.io 全体で1つなので、ほかの人が立てる時は自分の名前に変える。
app = "boshi-techo-try"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  # Claude に使ってよい額（ドル）: サーバ全体の1日・1つの体験の写しの1日。超えた日は見本の答えに落ちる
  BOSHI_DAILY_USD = "5"
  BOSHI_HOUSEHOLD_DAILY_USD = "0.5"
  # 1つの住所から1日に作れる体験の写し
  BOSHI_TRIALS_PER_IP_DAY = "10"

[[mounts]]
  source = "boshi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite を1台で持つので、止めずに1台だけ動かす
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
